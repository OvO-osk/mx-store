<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>商店 · M X 化妆品批发中心</title>
<meta name="description" content="M X 化妆品批发中心 · 按分类选购香水、粉底液、粉饼散粉、口红、精华、面霜、卸妆、洗面奶">
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231d1d1f'/%3E%3Ctext x='32' y='42' font-size='26' font-weight='700' text-anchor='middle' fill='%23fff' font-family='Arial'%3EMX%3C/text%3E%3C/svg%3E">
</head>
<body class="store">

<header class="gnav">
  <nav class="gnav-in">
    <button class="ico menu" id="menuBtn" aria-label="分类菜单"><svg viewBox="0 0 24 24"><path d="M4 8h16M4 16h16"/></svg></button>
    <a class="logo" href="index.html">M X <span>化妆品批发中心</span></a>
    <ul class="links" id="catLinks"></ul>
    <button class="ico bag" id="bagBtn" aria-label="购物车"><svg viewBox="0 0 24 24"><path d="M5 8h14l-1 13H6z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg><b id="bagN">0</b></button>
  </nav>
</header>
<div class="ribbon light">测试版网站 · 价格以正式上线为准。</div>

<main class="st">
  <div class="st-head">
    <h1>商店。<span>正品现货，挑你喜欢的。</span></h1>
  </div>
  <div class="cats rail-x" id="cats"></div>

  <!-- 分类页：标题 + 品牌筛选 + 商品格子 -->
  <section class="cat-page" id="catPage" hidden>
    <div class="cp-head">
      <h2 id="cpTitle"></h2>
      <p id="cpLead"></p>
    </div>
    <div class="chips" id="chips"></div>
    <div class="grid" id="grid"></div>
  </section>

  <!-- 全部：每个分类一条横向货架 -->
  <section id="allPage"></section>
</main>

<footer class="foot">
  <div class="foot-in">
    <p>测试版说明：库存数字目前只在你自己的浏览器里扣减（换手机或清缓存会恢复为 12），正式版接入在线数据库后才会对所有买家同步。标“价格待定”的商品暂不可加购。</p>
    <p class="copy">© 2026 M X 化妆品批发中心</p>
  </div>
</footer>

<!-- 商品详情弹窗 -->
<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="商品详情">
  <button class="sheet-x" id="sheetX" aria-label="关闭">✕</button>
  <div class="buy in-sheet" id="sheetBuy"></div>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="购物车">
  <div class="dh"><h3>购物车</h3><button id="closeCart" aria-label="关闭">✕</button></div>
  <div id="cartList"></div>
  <div class="df"><div class="sum"><span>合计</span><b id="sum">¥0</b></div><button class="btn wide" id="checkout">去结算</button></div>
</aside>
<div class="toast" id="toast"></div>

<script src="products.js"></script>
<script src="common.js"></script>
<script src="pay.js"></script>
<script src="shop.js"></script>
</body>
</html>
